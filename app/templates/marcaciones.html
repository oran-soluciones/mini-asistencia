{% extends "base.html" %}
{% from "_iconos.html" import ico %}
{% block titulo %}Marcaciones{% endblock %}
{% block contenido %}
<div class="titulo-fila">
  <h1>Marcaciones</h1>
</div>
<form method="get" action="/marcaciones" class="barra-filtro filtros">
  <label>Desde <input type="date" name="desde" value="{{ desde }}"></label>
  <label>Hasta <input type="date" name="hasta" value="{{ hasta }}"></label>
  <label>Empleado
    <select name="pin">
      <option value="">Todos</option>
      {% for p in pins %}
      <option value="{{ p.pin }}"{% if p.pin == pin %} selected{% endif %}>{{ p.pin }}{% if p.nombre %} - {{ p.nombre }}{% endif %}</option>
      {% endfor %}
    </select>
  </label>
  <div class="acciones">
    <button type="submit" class="btn">Filtrar</button>
    <a href="/marcaciones?desde=&amp;hasta=" class="btn btn-ghost">Ver todo</a>
  </div>
  <button type="submit" formaction="/marcaciones/excel" class="btn btn-primario derecha" data-descarga>{{ ico("excel") }}<span>Exportar a Excel</span></button>
</form>
{% include "_tabla_marcaciones.html" %}
{% endblock %}
