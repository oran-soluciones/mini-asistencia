<div id="reloj" class="reloj {{ 'conectado' if conectado else ('sin-contacto' if reloj else 'nunca') }}"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% if reloj %}
  Reloj <strong>{{ reloj.sn }}</strong>: último contacto hace {{ hace }}
  ({{ "conectado" if conectado else "sin contacto reciente" }})
  {% else %}
  Todavía no se conectó ningún reloj.
  {% endif %}
</div>
